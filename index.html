<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>马克思主义基本原理 · 在线刷题平台 (539题全收录)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚩</text></svg>">
<style>
:root {
  --primary: #c0392b;
  --primary-dark: #962d22;
  --primary-light: #fbeee6;
  --gold: #d4ac0d;
  --gold-bg: #fef9e7;
  --success: #27ae60;
  --success-bg: #eafaf1;
  --danger: #e74c3c;
  --danger-bg: #fdedec;
  --info: #2980b9;
  --info-bg: #ebf5fb;
  --purple: #8e44ad;
  --purple-bg: #f4ecf7;
  --gray-bg: #f4f6f9;
  --card-bg: #ffffff;
  --text-main: #2c3e50;
  --text-sub: #7f8c8d;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow: 0 4px 14px rgba(0,0,0,0.06);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--gray-bg);
  color: var(--text-main);
  min-height: 100vh;
  line-height: 1.6;
}
.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 16px;
  padding-bottom: 80px;
}
header {
  background: linear-gradient(135deg, #b03a2e 0%, #c0392b 60%, #e74c3c 100%);
  color: #fff;
  padding: 24px 20px 20px;
  text-align: center;
  border-radius: 0 0 20px 20px;
  box-shadow: 0 4px 20px rgba(176, 58, 46, 0.35);
  position: relative;
  overflow: hidden;
}
header::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -20%;
  width: 140%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
  pointer-events: none;
}
header h1 {
  font-size: 1.45rem;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 6px;
}
header .subtitle {
  font-size: 0.85rem;
  opacity: 0.92;
  font-weight: 300;
}
header .badges-bar {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.badge-stat {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(4px);
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  border: 1px solid rgba(255,255,255,0.25);
}

/* Tabs */
.nav-tabs {
  display: flex;
  background: #fff;
  margin: 16px 0;
  border-radius: var(--radius);
  padding: 4px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.tab-btn {
  flex: 1;
  padding: 10px 4px;
  text-align: center;
  border: none;
  background: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.tab-btn.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 2px 8px rgba(192, 57, 43, 0.3);
}
.pill-count {
  background: #fff;
  color: var(--primary);
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 0.72rem;
  font-weight: bold;
}
.tab-btn:not(.active) .pill-count {
  background: var(--danger-bg);
  color: var(--danger);
}

/* Toolbars */
.control-bar {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
}
.control-bar select, .control-bar input[type="text"], .control-bar button {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.88rem;
  border: 1px solid #cbd5e1;
  outline: none;
  background: #fff;
  transition: all 0.2s;
}
.control-bar select:focus, .control-bar input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(192,57,43,0.12);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s ease;
  user-select: none;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: #e2e8f0; color: #334155; }
.btn-secondary:hover { background: #cbd5e1; }
.btn-success { background: var(--success); color: #fff; }
.btn-warning { background: var(--gold); color: #fff; }
.btn-danger-outline { background: #fff; border: 1px solid var(--danger); color: var(--danger); }
.btn-danger-outline:hover { background: var(--danger-bg); }
.btn-star { background: none; border: none; font-size: 1.3rem; color: #cbd5e1; cursor: pointer; padding: 2px 6px; transition: color 0.15s; }
.btn-star.starred { color: #f39c12; }

/* Progress bar */
.progress-container {
  height: 6px;
  background: #e2e8f0;
  border-radius: 3px;
  margin-bottom: 14px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #c0392b, #e74c3c);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* Question Navigation Grid (Drawer) */
.nav-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.nav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.85rem;
  color: var(--text-sub);
}
.nav-toggle-btn {
  color: var(--primary);
  background: none;
  border: none;
  cursor: pointer;
  font-weight: 600;
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
  gap: 6px;
  margin-top: 10px;
  max-height: 100px;
  overflow-y: auto;
  transition: max-height 0.3s ease;
  padding: 2px;
}
.nav-grid.expanded {
  max-height: 320px;
}
.nav-dot {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f8fafc;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 0.75rem;
  cursor: pointer;
  color: #64748b;
  font-weight: 600;
  transition: all 0.15s;
}
.nav-dot:hover { background: #e2e8f0; }
.nav-dot.current { border: 2px solid var(--primary); color: var(--primary); font-weight: 800; background: var(--primary-light); }
.nav-dot.answered { background: #94a3b8; color: #fff; border-color: #94a3b8; }
.nav-dot.correct { background: var(--success); color: #fff; border-color: var(--success); }
.nav-dot.wrong { background: var(--danger); color: #fff; border-color: var(--danger); }
.nav-dot.marked { position: relative; }
.nav-dot.marked::after {
  content: "★";
  position: absolute;
  top: -4px;
  right: -2px;
  font-size: 8px;
  color: #f39c12;
}

/* Question Card */
.q-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 22px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 14px;
  position: relative;
}
.q-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  border-bottom: 1px solid #f1f5f9;
  padding-bottom: 10px;
}
.q-type-badge {
  font-size: 0.76rem;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.badge-single { background: var(--success-bg); color: var(--success); border: 1px solid rgba(39,174,96,0.25); }
.badge-multi { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(142,68,173,0.25); }
.badge-fill { background: var(--info-bg); color: var(--info); border: 1px solid rgba(41,128,185,0.25); }
.badge-short { background: #fef5e7; color: #d35400; border: 1px solid rgba(211,84,0,0.25); }

.q-title {
  font-size: 1.08rem;
  font-weight: 600;
  color: #1e293b;
  margin-bottom: 20px;
  line-height: 1.7;
}

/* Choice Options */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.option-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border: 2px solid #e2e8f0;
  border-radius: 10px;
  cursor: pointer;
  background: #fff;
  transition: all 0.15s ease;
  font-size: 0.95rem;
  line-height: 1.5;
  user-select: none;
}
.option-item:hover {
  border-color: #cbd5e1;
  background: #f8fafc;
}
.option-item.selected {
  border-color: var(--primary);
  background: var(--primary-light);
}
.option-item.correct {
  border-color: var(--success) !important;
  background: var(--success-bg) !important;
  color: #145a32;
  font-weight: 600;
}
.option-item.wrong {
  border-color: var(--danger) !important;
  background: var(--danger-bg) !important;
  color: #78281f;
}
.option-item input {
  margin-top: 3px;
  accent-color: var(--primary);
  width: 17px;
  height: 17px;
}

/* Fill-in input */
.fill-box {
  margin: 16px 0;
}
.fill-input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #cbd5e1;
  border-radius: 10px;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
.fill-input:focus {
  border-color: var(--info);
  box-shadow: 0 0 0 3px rgba(41,128,185,0.15);
}

/* Short answer essay box */
.essay-box {
  margin: 16px 0;
}
.essay-textarea {
  width: 100%;
  min-height: 90px;
  padding: 12px 14px;
  border: 2px solid #cbd5e1;
  border-radius: 10px;
  font-size: 0.95rem;
  outline: none;
  resize: vertical;
  font-family: inherit;
}
.essay-textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212,172,13,0.15);
}

/* Answer feedback box */
.feedback-box {
  margin-top: 18px;
  padding: 14px 18px;
  border-radius: 10px;
  font-size: 0.95rem;
  display: none;
  animation: fadeIn 0.2s ease;
}
.feedback-box.show { display: block; }
.feedback-box.correct { background: var(--success-bg); color: #1e8449; border: 1px solid #abebc6; }
.feedback-box.wrong { background: var(--danger-bg); color: #c0392b; border: 1px solid #fadbd8; }
.feedback-box.reference { background: #fef9e7; color: #7d6608; border: 1px solid #f9e79f; }
.feedback-ans { font-weight: bold; margin-top: 4px; line-height: 1.6; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Navigation buttons */
.action-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
}

/* Exam Mode Specifics */
.exam-timer {
  background: var(--gold-bg);
  border: 1px solid var(--gold);
  color: #7d6608;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9rem;
}

/* Overlay / Results Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(4px);
  z-index: 1000;
  overflow-y: auto;
  padding: 30px 14px;
  align-items: flex-start;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-card {
  background: #fff;
  border-radius: 18px;
  width: 100%;
  max-width: 620px;
  padding: 28px 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  animation: modalSlide 0.25s ease-out;
}
@keyframes modalSlide {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-score {
  text-align: center;
  padding: 16px 0;
  border-bottom: 1px solid #f1f5f9;
}
.modal-score .big-num {
  font-size: 3.6rem;
  font-weight: 800;
  line-height: 1;
}
.score-pass { color: var(--success); }
.score-warn { color: var(--gold); }
.score-fail { color: var(--danger); }

/* Review items in result modal */
.review-list {
  margin-top: 16px;
  max-height: 380px;
  overflow-y: auto;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 8px 12px;
}
.review-row {
  padding: 10px 0;
  border-bottom: 1px solid #f1f5f9;
  font-size: 0.9rem;
}
.review-row:last-child { border-bottom: none; }
.review-row .tag-res {
  font-weight: bold;
  margin-right: 6px;
}

/* Browse Mode */
.search-input-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
}
.search-input-wrap input {
  width: 100%;
  padding-left: 34px !important;
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-sub);
  font-size: 0.9rem;
}
.browse-item {
  background: #fff;
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}
.browse-ans-box {
  margin-top: 10px;
  padding: 10px 14px;
  background: #f8fafc;
  border-radius: 8px;
  border-left: 4px solid var(--primary);
  font-size: 0.92rem;
}
.browse-hidden-ans {
  filter: blur(4px);
  user-select: none;
  cursor: pointer;
  transition: filter 0.2s;
}
.browse-hidden-ans:hover, .browse-hidden-ans.revealed {
  filter: none;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  color: var(--text-sub);
}
.empty-icon {
  font-size: 3rem;
  margin-bottom: 12px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(30, 41, 59, 0.9);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 0.88rem;
  z-index: 2000;
  transition: all 0.3s ease;
  pointer-events: none;
  opacity: 0;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Resume Prompt */
.resume-banner {
  background: linear-gradient(135deg, #fef9e7 0%, #fff3cd 100%);
  border: 1px solid #ffeeba;
  border-radius: var(--radius);
  padding: 10px 16px;
  margin-bottom: 14px;
  display: none;
  align-items: center;
  justify-content: space-between;
  font-size: 0.88rem;
  color: #856404;
}
.resume-banner.show { display: flex; }

footer {
  text-align: center;
  color: #94a3b8;
  font-size: 0.8rem;
  margin-top: 30px;
  line-height: 1.8;
}
</style>
</head>
<body>

<header>
  <h1>📚 马克思主义基本原理</h1>
  <div class="subtitle">马克思主义基本原理在线刷题 · 539 题权威完整精选题库</div>
  <div class="badges-bar">
    <span class="badge-stat">单选 380 题</span>
    <span class="badge-stat">多选 159 题</span>
    <span class="badge-stat">📚 539 道全题库</span>
    <span class="badge-stat" id="storageStatus">💾 自动本地保存</span>
  </div>
</header>

<div class="container">
  <!-- Mode Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tabStudy" onclick="switchMode('study')">📖 刷题模式</button>
    <button class="tab-btn" id="tabExam" onclick="switchMode('exam')">📝 模拟考试</button>
    <button class="tab-btn" id="tabBrowse" onclick="switchMode('browse')">📋 题库速览</button>
    <button class="tab-btn" id="tabWrong" onclick="switchMode('wrong')">❌ 错题本<span class="pill-count" id="wrongBadge" style="display:none">0</span></button>
    <button class="tab-btn" id="tabFav" onclick="switchMode('fav')">⭐ 收藏夹<span class="pill-count" id="favBadge" style="display:none">0</span></button>
  </div>

  <!-- Study Resume Banner -->
  <div class="resume-banner" id="resumeBanner">
    <span>📌 检测到上次刷题记录（第 <b id="resumeIdxText">1</b> 题）</span>
    <div style="display:flex;gap:6px">
      <button class="btn btn-warning" style="padding:4px 10px;font-size:0.8rem" onclick="resumeLastProgress()">继续练习</button>
      <button class="btn btn-secondary" style="padding:4px 8px;font-size:0.8rem" onclick="dismissResume()">✕</button>
    </div>
  </div>

  <!-- STUDY CONTROLS -->
  <div id="studyControls" class="control-bar">
    <label style="font-size:0.88rem;color:var(--text-sub)">题型筛选：</label>
    <select id="studyTypeFilter" onchange="onStudyTypeChange()">
      <option value="all">全部题型 (539题)</option>
      <option value="single">单项选择题 (380题)</option>
      <option value="multi">多项选择题 (159题)</option>
    </select>
    <button class="btn btn-secondary" onclick="restartStudy(false)">🔄 重新开始</button>
    <button class="btn btn-secondary" onclick="restartStudy(true)">🔀 随机乱序</button>
    <label style="font-size:0.85rem;display:flex;align-items:center;gap:4px;margin-left:auto;cursor:pointer">
      <input type="checkbox" id="autoAdvanceToggle" checked> 答对自动下一题
    </label>
    <span style="font-size:0.88rem;font-weight:600;color:var(--primary)" id="studyStat">✅ 0 / 0</span>
  </div>

  <!-- EXAM CONTROLS -->
  <div id="examControls" class="control-bar" style="display:none">
    <select id="examPaperType">
      <option value="standard100">🎯 全真期末模拟卷 (100题: 单选70+多选30)</option>
      <option value="random50">🎲 随机抽选 50 题测试 (单选35+多选15)</option>
      <option value="single50">🎯 单选题专项突破 (50题)</option>
      <option value="multi30">🎯 多选题专项攻坚 (30题)</option>
    </select>
    <button class="btn btn-primary" onclick="startNewExam()">🚀 开始考试</button>
    <div class="exam-timer" id="examTimer" style="display:none">⏱️ 00:00</div>
    <button class="btn btn-success" id="submitExamBtn" onclick="submitExam()" style="margin-left:auto;display:none">📮 交卷判分</button>
  </div>

  <!-- BROWSE CONTROLS -->
  <div id="browseControls" class="control-bar" style="display:none">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="browseSearchInput" placeholder="输入关键词搜索题目或答案..." oninput="onBrowseSearch()">
    </div>
    <select id="browseTypeFilter" onchange="renderBrowseList()">
      <option value="all">全部题型 (539题)</option>
      <option value="single">单项选择题 (380题)</option>
      <option value="multi">多项选择题 (159题)</option>
    </select>
    <label style="font-size:0.85rem;display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="hideAnswerToggle" onchange="renderBrowseList()"> 🙈 背题模式(隐藏答案)
    </label>
    <span style="font-size:0.85rem;color:var(--text-sub)" id="browseCountText">共 539 题</span>
  </div>

  <!-- WRONG BOOK CONTROLS -->
  <div id="wrongControls" class="control-bar" style="display:none">
    <button class="btn btn-primary" onclick="practiceWrongQuestions()">🔁 重练全部错题</button>
    <button class="btn btn-danger-outline" onclick="clearAllWrong()">🗑️ 清空错题本</button>
    <span style="font-size:0.88rem;color:var(--text-sub);margin-left:auto" id="wrongStatText">0 道错题</span>
  </div>

  <!-- FAVORITE CONTROLS -->
  <div id="favControls" class="control-bar" style="display:none">

var ALL_QUESTIONS = RAW_QUESTIONS;

// LocalStorage Keys
var KEY_STUDY_PROGRESS = "my_study_progress_v2";
var KEY_WRONG_BOOK = "my_wrong_book_v2";
var KEY_FAVORITES = "my_favorites_v2";

// Global State
var currentMode = 'study'; // 'study', 'exam', 'browse', 'wrong', 'fav'
var activeQuestions = [];
var currentIdx = 0;
var userAnswers = {};
var checkedStatus = {};
var correctCount = 0;
var totalAttempted = 0;
var autoAdvanceTimer = null;

// Exam State
var examTimerInterval = null;
var examSeconds = 0;

// Wrong Book & Favorites Storage
function getWrongBook() {
  try { return JSON.parse(localStorage.getItem(KEY_WRONG_BOOK) || "[]"); } catch(e) { return []; }
}
function saveWrongBook(list) {
  try { localStorage.setItem(KEY_WRONG_BOOK, JSON.stringify(list)); } catch(e) {}
  updateBadges();
}
function addToWrongBook(q, userAns) {
  var list = getWrongBook();
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === q.id) {
      list[i].wrongCount = (list[i].wrongCount || 1) + 1;
      list[i].lastWrong = Date.now();
      list[i].lastUserAns = userAns;
      saveWrongBook(list);
      return;
    }
  }
  list.unshift({
    id: q.id,
    question: q.question,
    options: q.options || [],
    answer: q.answer,
    type: q.type,
    category: q.category,
    wrongCount: 1,
    lastWrong: Date.now(),
    lastUserAns: userAns
  });
  saveWrongBook(list);
}
function removeFromWrongBook(id) {
  var list = getWrongBook().filter(function(x) { return x.id !== id; });
  saveWrongBook(list);
  if (currentMode === 'wrong') renderWrongModeList();
  showToast("已从错题本移除");
}

function getFavorites() {
  try { return JSON.parse(localStorage.getItem(KEY_FAVORITES) || "[]"); } catch(e) { return []; }
}
function saveFavorites(list) {
  try { localStorage.setItem(KEY_FAVORITES, JSON.stringify(list)); } catch(e) {}
  updateBadges();
}
function toggleFavorite(qId) {
  var list = getFavorites();
  var idx = list.indexOf(qId);
  var isStarred = false;
  if (idx >= 0) {
    list.splice(idx, 1);
    showToast("已取消收藏");
  } else {
    list.push(qId);
    isStarred = true;
    showToast("已加入收藏夹 ⭐");
  }
  saveFavorites(list);
  if (currentMode === 'study' || currentMode === 'exam') {
    var starBtn = document.getElementById("starBtn");
    if (starBtn) starBtn.classList.toggle("starred", isStarred);
  } else if (currentMode === 'fav') {
    renderFavModeList();
  }
  renderNavGrid();
}
function isFavorited(qId) {
  return getFavorites().indexOf(qId) >= 0;
}

function updateBadges() {
  var wb = getWrongBook();
  var wbBadge = document.getElementById("wrongBadge");
  if (wbBadge) {
    wbBadge.textContent = wb.length;
    wbBadge.style.display = wb.length > 0 ? "inline" : "none";
  }
  var fav = getFavorites();
  var favBadge = document.getElementById("favBadge");
  if (favBadge) {
    favBadge.textContent = fav.length;
    favBadge.style.display = fav.length > 0 ? "inline" : "none";
  }
}

// Toast
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove("show"); }, 2000);
}

// ==========================================
// 2. STUDY MODE
// ==========================================
function initStudy(typeFilter, shuffle, savedState) {
  currentMode = 'study';
  var pool = ALL_QUESTIONS;
  if (typeFilter && typeFilter !== 'all') {
    pool = pool.filter(function(q) { return q.type === typeFilter; });
  }
  activeQuestions = pool.slice();
  if (shuffle) {
    activeQuestions.sort(function() { return Math.random() - 0.5; });
  }

  if (savedState && savedState.questionsLength === activeQuestions.length) {
    currentIdx = savedState.currentIdx || 0;
    userAnswers = savedState.userAnswers || {};
    checkedStatus = savedState.checkedStatus || {};
    correctCount = savedState.correctCount || 0;
    totalAttempted = savedState.totalAttempted || 0;
  } else {
    currentIdx = 0;
    userAnswers = {};
    checkedStatus = {};
    correctCount = 0;
    totalAttempted = 0;
  }

  document.getElementById("progressWrap").style.display = "block";
  document.getElementById("questionNavWrap").style.display = "block";
  document.getElementById("bottomNavButtons").style.display = "flex";

  updateStudyStats();
  renderCurrentQuestion();
  renderNavGrid();
}

function onStudyTypeChange() {
  var type = document.getElementById("studyTypeFilter").value;
  initStudy(type, false, null);
}

function restartStudy(shuffle) {
  var type = document.getElementById("studyTypeFilter").value;
  initStudy(type, shuffle, null);
  showToast(shuffle ? "已重新随机打乱刷题！" : "已重新开始顺序刷题！");
}

function saveStudyProgress() {
  var state = {
    typeFilter: document.getElementById("studyTypeFilter").value,
    currentIdx: currentIdx,
    questionsLength: activeQuestions.length,
    userAnswers: userAnswers,
    checkedStatus: checkedStatus,
    correctCount: correctCount,
    totalAttempted: totalAttempted,
    ts: Date.now()
  };
  try { localStorage.setItem(KEY_STUDY_PROGRESS, JSON.stringify(state)); } catch(e) {}
}

function checkResumeStudy() {
  try {
    var raw = localStorage.getItem(KEY_STUDY_PROGRESS);
    if (!raw) return;
    var state = JSON.parse(raw);
    if (state && state.currentIdx > 0 && state.questionsLength === ALL_QUESTIONS.length) {
      document.getElementById("resumeIdxText").textContent = (state.currentIdx + 1);
      document.getElementById("resumeBanner").classList.add("show");
    }
  } catch(e) {}
}

function resumeLastProgress() {
  try {
    var raw = localStorage.getItem(KEY_STUDY_PROGRESS);
    if (!raw) return;
    var state = JSON.parse(raw);
    document.getElementById("resumeBanner").classList.remove("show");
    document.getElementById("studyTypeFilter").value = state.typeFilter || 'all';
    initStudy(state.typeFilter || 'all', false, state);
    showToast("已恢复上次做题进度");
  } catch(e) {}
}

function dismissResume() {
  document.getElementById("resumeBanner").classList.remove("show");
}

function updateStudyStats() {
  document.getElementById("studyStat").textContent = "✅ " + correctCount + " / " + totalAttempted;
  var pct = activeQuestions.length > 0 ? (totalAttempted / activeQuestions.length * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("currentIdxLabel").textContent = (currentIdx + 1);
  document.getElementById("totalIdxLabel").textContent = activeQuestions.length;
}

// Normalizer for fill-in matching
function normalizeText(s) {
  if (!s) return "";
  return s.toString().trim().toLowerCase().replace(/[《》""''“”‘’\s\.,，。、？！?!；;：:]+/g, "");
}

// Render Current Question Card
function renderCurrentQuestion() {
  if (activeQuestions.length === 0) {
    document.getElementById("questionArea").innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><h3>没有找到符合条件的题目</h3></div>';
    return;
  }
  var q = activeQuestions[currentIdx];
  var qNum = currentIdx + 1;
  var isDone = checkedStatus[currentIdx] === true;
  var isFav = isFavorited(q.id);

  // Type badge styling
  var badgeClass = "badge-single";
  var typeName = "单项选择题";
  if (q.type === 'multi') { badgeClass = "badge-multi"; typeName = "多项选择题"; }
  else if (q.type === 'fill') { badgeClass = "badge-fill"; typeName = "填空题"; }
  else if (q.type === 'short') { badgeClass = "badge-short"; typeName = "简答题"; }

  var html = '<div class="q-card">';
  
  // Card header
  html += '<div class="q-top">';
  html += '  <div style="display:flex;align-items:center;gap:8px;">';
  html += '    <span class="q-type-badge ' + badgeClass + '">' + typeName + '</span>';
  html += '    <span style="font-size:0.85rem;color:var(--text-sub);">第 ' + qNum + ' / ' + activeQuestions.length + ' 题</span>';
  html += '  </div>';
  html += '  <button class="btn-star ' + (isFav ? 'starred' : '') + '" id="starBtn" onclick="toggleFavorite(\'' + q.id + '\')" title="收藏本题">★</button>';
  html += '</div>';

  // Title
  html += '<div class="q-title">' + q.question + '</div>';

  // Options or Inputs depending on type
  if (q.type === 'single' || q.type === 'multi') {
    html += '<div class="options-list">';
    var isMulti = q.type === 'multi';
    var userAnsList = userAnswers[currentIdx] || [];
    var correctAns = (q.answer || "").toUpperCase();

    for (var i = 0; i < q.options.length; i++) {
      var optText = q.options[i];
      var letterMatch = optText.match(/^([A-D])[\s\.、]/);
      var letter = letterMatch ? letterMatch[1] : String.fromCharCode(65 + i);
      var isSelected = userAnsList.indexOf(letter) >= 0;
      var optClass = "option-item";
      if (isSelected) optClass += " selected";

      if (isDone) {
        if (correctAns.indexOf(letter) >= 0) optClass += " correct";
        else if (isSelected) optClass += " wrong";
      }

      html += '<label class="' + optClass + '">';
      html += '  <input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="opt_' + currentIdx + '" value="' + letter + '"';
      if (isSelected) html += ' checked';
      if (isDone) html += ' disabled';
      html += '   onchange="onSelectOption(\'' + letter + '\')">';
      html += '  <span>' + optText + '</span>';
      html += '</label>';
    }
    html += '</div>';

    // Multi-choice Submit Button
    if (isMulti && !isDone) {
      var hasSelected = userAnsList.length > 0;
      html += '<div style="margin-top:16px;">';
      html += '  <button class="btn btn-primary" style="width:100%;padding:10px;" onclick="submitAnswer()" ' + (hasSelected ? '' : 'disabled') + '>提交查看答案</button>';
      html += '</div>';
    }
  } else if (q.type === 'fill') {
    var curVal = userAnswers[currentIdx] || "";
    html += '<div class="fill-box">';
    html += '  <input type="text" class="fill-input" id="fillInput" placeholder="请输入你的答案，按回车或点击核对..." value="' + (curVal.replace(/"/g, '&quot;')) + '"';
    if (isDone) html += ' readonly';
    html += '   onkeydown="if(event.key===\'Enter\')submitAnswer()">';
    html += '</div>';
    if (!isDone) {
      html += '<div style="display:flex;gap:10px;">';
      html += '  <button class="btn btn-primary" onclick="submitAnswer()">核对答案</button>';
      html += '  <button class="btn btn-secondary" onclick="showFillAnswerDirectly()">不确定？直接看答案</button>';
      html += '</div>';
    }
  } else if (q.type === 'short') {
    var curVal = userAnswers[currentIdx] || "";
    html += '<div class="essay-box">';
    html += '  <textarea class="essay-textarea" id="essayInput" placeholder="可在此输入你的作答思路或默写要点..." oninput="userAnswers[' + currentIdx + ']=this.value;saveStudyProgress();">' + curVal + '</textarea>';
    html += '</div>';
    if (!isDone) {
      html += '<div style="display:flex;gap:10px;">';
      html += '  <button class="btn btn-primary" onclick="submitAnswer()">💡 查看参考要点 / 采分点</button>';
      html += '</div>';
    }
  }

  // Feedback box if done
  if (isDone) {
    var isRight = checkedStatus[currentIdx + "_correct"];
    var fbClass = isRight ? "correct" : "wrong";
    if (q.type === 'short') fbClass = "reference";

    html += '<div class="feedback-box show ' + fbClass + '">';
    if (q.type === 'short') {
      html += '  <div><b>💡 参考要点与采分标准：</b></div>';
      html += '  <div class="feedback-ans">' + q.answer + '</div>';
      html += '  <div style="margin-top:12px;display:flex;gap:10px;align-items:center;">';
      html += '    <span style="font-size:0.85rem">自我评估：</span>';
      html += '    <button class="btn btn-success" style="padding:4px 10px;font-size:0.8rem;" onclick="markShortMastered(true)">已掌握 ✅</button>';
      html += '    <button class="btn btn-danger-outline" style="padding:4px 10px;font-size:0.8rem;" onclick="markShortMastered(false)">需加强 (收入错题本) ❌</button>';
      html += '  </div>';
    } else {
      var icon = isRight ? "✅ 回答正确！" : "❌ 回答错误！";
      html += '  <div><b>' + icon + '</b></div>';
      html += '  <div class="feedback-ans">正确答案：<b>' + q.answer + '</b></div>';
      if (q.type === 'fill' && !isRight) {
        html += '  <div style="font-size:0.85rem;margin-top:4px;color:var(--text-sub)">你的输入：' + (userAnswers[currentIdx] || "未作答") + '</div>';
      }
    }
    html += '</div>';
  }

  html += '</div>'; // End .q-card
  document.getElementById("questionArea").innerHTML = html;
  
  if (q.type === 'fill' && !isDone) {
    var inp = document.getElementById("fillInput");
    if (inp) inp.focus();
  }
}

// Option selection
function onSelectOption(letter) {
  if (checkedStatus[currentIdx]) return;
  var q = activeQuestions[currentIdx];
  if (q.type === 'single') {
    userAnswers[currentIdx] = [letter];
    submitAnswer();
  } else if (q.type === 'multi') {
    if (!userAnswers[currentIdx]) userAnswers[currentIdx] = [];
    var arr = userAnswers[currentIdx];
    var idx = arr.indexOf(letter);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(letter);
    renderCurrentQuestion();
  }
  saveStudyProgress();
}

// Answer submission
function submitAnswer() {
  if (checkedStatus[currentIdx]) return;
  var q = activeQuestions[currentIdx];
  var isRight = false;
  var userAnsStr = "";

  if (q.type === 'single') {
    var sel = (userAnswers[currentIdx] || [])[0] || "";
    userAnsStr = sel;
    isRight = sel.toUpperCase() === q.answer.trim().toUpperCase();
  } else if (q.type === 'multi') {
    var selArr = (userAnswers[currentIdx] || []).slice().sort();
    userAnsStr = selArr.join("");
    var correctArr = q.answer.trim().toUpperCase().replace(/\s/g, '').split("").sort();
    isRight = selArr.join("") === correctArr.join("");
  } else if (q.type === 'fill') {
    var inp = document.getElementById("fillInput");
    if (inp) userAnswers[currentIdx] = inp.value;
    userAnsStr = userAnswers[currentIdx] || "";
    var uNorm = normalizeText(userAnsStr);
    var cNorm = normalizeText(q.answer);
    isRight = (uNorm === cNorm) || (cNorm.length >= 2 && uNorm.length >= 2 && (cNorm.indexOf(uNorm) >= 0 || uNorm.indexOf(cNorm) >= 0));
  } else if (q.type === 'short') {
    var txt = document.getElementById("essayInput");
    if (txt) userAnswers[currentIdx] = txt.value;
    userAnsStr = userAnswers[currentIdx] || "";
    isRight = true; // wait for self-marking
  }

  checkedStatus[currentIdx] = true;
  checkedStatus[currentIdx + "_correct"] = isRight;
  totalAttempted++;

  if (isRight && q.type !== 'short') {
    correctCount++;
  } else if (!isRight && q.type !== 'short') {
    addToWrongBook(q, userAnsStr);
  }

  updateStudyStats();
  saveStudyProgress();
  renderCurrentQuestion();
  renderNavGrid();

  // Auto-advance if enabled and correct
  var autoAdvance = document.getElementById("autoAdvanceToggle").checked;
  if (isRight && autoAdvance && currentIdx < activeQuestions.length - 1 && q.type !== 'short') {
    clearTimeout(autoAdvanceTimer);
    autoAdvanceTimer = setTimeout(function() {
      nextQuestion();
    }, 380);
  }
}

function showFillAnswerDirectly() {
  userAnswers[currentIdx] = "未作答";
  submitAnswer();
}

function markShortMastered(mastered) {
  var q = activeQuestions[currentIdx];
  if (!mastered) {
    addToWrongBook(q, userAnswers[currentIdx] || "待强化");
    showToast("已收入错题本，稍后多加温习！");
  } else {
    showToast("太棒了！已标记为熟练掌握");
  }
}

// Navigation between questions
function nextQuestion() {
  if (currentIdx < activeQuestions.length - 1) {
    currentIdx++;
    renderCurrentQuestion();
    updateStudyStats();
    saveStudyProgress();
  } else {
    showToast("已经是最后一题了！");
  }
}

function prevQuestion() {
  if (currentIdx > 0) {
    currentIdx--;
    renderCurrentQuestion();
    updateStudyStats();
    saveStudyProgress();
  } else {
    showToast("已经是第一题了！");
  }
}

function jumpTo(idx) {
  if (idx >= 0 && idx < activeQuestions.length) {
    currentIdx = idx;
    renderCurrentQuestion();
    updateStudyStats();
    saveStudyProgress();
  }
}

function handleJump() {
  var inp = document.getElementById("jumpInput");
  var val = parseInt(inp.value, 10);
  if (!isNaN(val) && val >= 1 && val <= activeQuestions.length) {
    jumpTo(val - 1);
    inp.value = "";
  } else {
    alert("请输入有效题号 (1 - " + activeQuestions.length + ")");
  }
}

// Nav Drawer Grid
function renderNavGrid() {
  var grid = document.getElementById("questionNavGrid");
  var html = "";
  for (var i = 0; i < activeQuestions.length; i++) {
    var cls = "nav-dot";
    if (i === currentIdx) cls += " current";
    if (checkedStatus[i]) {
      if (activeQuestions[i].type === 'short') cls += " answered";
      else cls += checkedStatus[i + "_correct"] ? " correct" : " wrong";
    } else if (currentMode === 'exam' && userAnswers[i] && userAnswers[i].length > 0) {
      cls += " answered";
    }
    if (isFavorited(activeQuestions[i].id)) cls += " marked";
    html += '<div class="' + cls + '" onclick="jumpTo(' + i + ')">' + (i + 1) + '</div>';
  }
  grid.innerHTML = html;

  var cur = grid.querySelector(".nav-dot.current");
  if (cur) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function toggleNavGrid() {
  var grid = document.getElementById("questionNavGrid");
  var btn = document.getElementById("navToggleBtn");
  if (grid.classList.contains("expanded")) {
    grid.classList.remove("expanded");
    btn.textContent = "展开答题卡 ▾";
  } else {
    grid.classList.add("expanded");
    btn.textContent = "收起答题卡 ▴";
  }
}

// ==========================================
// 3. EXAM / TEST MODE
// ==========================================
function startNewExam() {
  clearInterval(examTimerInterval);
  var paperType = document.getElementById("examPaperType").value;
  var selected = [];

  if (paperType === 'standard100') {
    // 70 single + 30 multi = 100 questions
    var s = ALL_QUESTIONS.filter(function(q) { return q.type === 'single'; }).sort(function() { return Math.random() - 0.5; });
    var m = ALL_QUESTIONS.filter(function(q) { return q.type === 'multi'; }).sort(function() { return Math.random() - 0.5; });
    selected = s.slice(0, 70).concat(m.slice(0, 30)).sort(function() { return Math.random() - 0.5; });
  } else if (paperType === 'random50') {
    var s = ALL_QUESTIONS.filter(function(q) { return q.type === 'single'; }).sort(function() { return Math.random() - 0.5; });
    var m = ALL_QUESTIONS.filter(function(q) { return q.type === 'multi'; }).sort(function() { return Math.random() - 0.5; });
    selected = s.slice(0, 35).concat(m.slice(0, 15)).sort(function() { return Math.random() - 0.5; });
  } else if (paperType === 'single50') {
    var pool = ALL_QUESTIONS.filter(function(q) { return q.type === 'single'; }).sort(function() { return Math.random() - 0.5; });
    selected = pool.slice(0, 50);
  } else if (paperType === 'multi30') {
    var pool = ALL_QUESTIONS.filter(function(q) { return q.type === 'multi'; }).sort(function() { return Math.random() - 0.5; });
    selected = pool.slice(0, 30);
  } else {
    var pool = ALL_QUESTIONS.slice().sort(function() { return Math.random() - 0.5; });
    selected = pool.slice(0, 100);
  }

  activeQuestions = selected;
  currentIdx = 0;
  userAnswers = {};
  checkedStatus = {};
  correctCount = 0;
  totalAttempted = 0;

  // Start Timer
  examSeconds = 0;
  var timerEl = document.getElementById("examTimer");
  timerEl.style.display = "inline-flex";
  timerEl.textContent = "⏱️ 00:00";
  examTimerInterval = setInterval(function() {
    examSeconds++;
    var mm = Math.floor(examSeconds / 60);
    var ss = examSeconds % 60;
    timerEl.textContent = "⏱️ " + (mm < 10 ? "0" + mm : mm) + ":" + (ss < 10 ? "0" + ss : ss);
  }, 1000);

  document.getElementById("submitExamBtn").style.display = "inline-flex";
  document.getElementById("progressWrap").style.display = "block";
  document.getElementById("questionNavWrap").style.display = "block";
  document.getElementById("bottomNavButtons").style.display = "flex";

  renderExamQuestion();
  renderNavGrid();
  showToast("全真考试开始！共 " + activeQuestions.length + " 题，祝顺利！");
}

function renderExamQuestion() {
  if (activeQuestions.length === 0) return;
  var q = activeQuestions[currentIdx];
  var qNum = currentIdx + 1;
  var isFav = isFavorited(q.id);

  var badgeClass = "badge-single";
  var typeName = "单项选择题";
  if (q.type === 'multi') { badgeClass = "badge-multi"; typeName = "多项选择题"; }
  else if (q.type === 'fill') { badgeClass = "badge-fill"; typeName = "填空题"; }
  else if (q.type === 'short') { badgeClass = "badge-short"; typeName = "简答题"; }

  var html = '<div class="q-card">';
  html += '<div class="q-top">';
  html += '  <div style="display:flex;align-items:center;gap:8px;">';
  html += '    <span class="q-type-badge ' + badgeClass + '">' + typeName + '</span>';
  html += '    <span style="font-size:0.85rem;color:var(--text-sub);">第 ' + qNum + ' / ' + activeQuestions.length + ' 题</span>';
  html += '  </div>';
  html += '  <button class="btn-star ' + (isFav ? 'starred' : '') + '" onclick="toggleFavorite(\'' + q.id + '\')" title="收藏本题">★</button>';
  html += '</div>';

  html += '<div class="q-title">' + q.question + '</div>';

  if (q.type === 'single' || q.type === 'multi') {
    html += '<div class="options-list">';
    var isMulti = q.type === 'multi';
    var userAnsList = userAnswers[currentIdx] || [];

    for (var i = 0; i < q.options.length; i++) {
      var optText = q.options[i];
      var letterMatch = optText.match(/^([A-D])[\s\.、]/);
      var letter = letterMatch ? letterMatch[1] : String.fromCharCode(65 + i);
      var isSelected = userAnsList.indexOf(letter) >= 0;

      html += '<label class="option-item ' + (isSelected ? 'selected' : '') + '">';
      html += '  <input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="exam_opt_' + currentIdx + '" value="' + letter + '"';
      if (isSelected) html += ' checked';
      html += '   onchange="onExamSelectOption(\'' + letter + '\')">';
      html += '  <span>' + optText + '</span>';
      html += '</label>';
    }
    html += '</div>';
  } else if (q.type === 'fill') {
    var curVal = userAnswers[currentIdx] || "";
    html += '<div class="fill-box">';
    html += '  <input type="text" class="fill-input" placeholder="请填入答案..." value="' + (curVal.replace(/"/g, '&quot;')) + '" oninput="userAnswers[' + currentIdx + ']=this.value;renderNavGrid();">';
    html += '</div>';
  } else if (q.type === 'short') {
    var curVal = userAnswers[currentIdx] || "";
    html += '<div class="essay-box">';
    html += '  <textarea class="essay-textarea" placeholder="在此键入作答要点..." oninput="userAnswers[' + currentIdx + ']=this.value;renderNavGrid();">' + curVal + '</textarea>';
    html += '</div>';
  }

  html += '</div>';
  document.getElementById("questionArea").innerHTML = html;
  updateExamProgress();
}

function onExamSelectOption(letter) {
  var q = activeQuestions[currentIdx];
  if (q.type === 'single') {
    userAnswers[currentIdx] = [letter];
  } else if (q.type === 'multi') {
    if (!userAnswers[currentIdx]) userAnswers[currentIdx] = [];
    var arr = userAnswers[currentIdx];
    var idx = arr.indexOf(letter);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(letter);
  }
  renderExamQuestion();
  renderNavGrid();
}

function updateExamProgress() {
  var answered = 0;
  for (var k in userAnswers) {
    if (userAnswers[k] && userAnswers[k].length > 0) answered++;
  }
  var pct = activeQuestions.length > 0 ? (answered / activeQuestions.length * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("currentIdxLabel").textContent = (currentIdx + 1);
  document.getElementById("totalIdxLabel").textContent = activeQuestions.length;
}

function submitExam() {
  var answered = 0;
  for (var k in userAnswers) {
    if (userAnswers[k] && userAnswers[k].length > 0) answered++;
  }
  var unanswered = activeQuestions.length - answered;
  if (unanswered > 0) {
    if (!confirm("还有 " + unanswered + " 道题尚未作答，确定现在提前交卷吗？")) return;
  } else {
    if (!confirm("确定提交试卷并判分吗？")) return;
  }

  clearInterval(examTimerInterval);

  // Grade exam
  var correct = 0;
  var scorableTotal = 0;
  var details = [];
  var wrongItems = [];

  for (var i = 0; i < activeQuestions.length; i++) {
    var q = activeQuestions[i];
    var uAns = userAnswers[i];
    var uAnsStr = "";
    var isRight = false;

    if (q.type === 'single') {
      scorableTotal++;
      uAnsStr = (uAns && uAns.length > 0) ? uAns[0] : "";
      isRight = uAnsStr.toUpperCase() === q.answer.trim().toUpperCase();
    } else if (q.type === 'multi') {
      scorableTotal++;
      uAnsStr = uAns ? uAns.slice().sort().join("") : "";
      var cArr = q.answer.trim().toUpperCase().replace(/\s/g, '').split("").sort().join("");
      isRight = uAnsStr === cArr;
    } else if (q.type === 'fill') {
      scorableTotal++;
      uAnsStr = uAns || "";
      var uNorm = normalizeText(uAnsStr);
      var cNorm = normalizeText(q.answer);
      isRight = (uNorm === cNorm) || (cNorm.length >= 2 && uNorm.length >= 2 && (cNorm.indexOf(uNorm) >= 0 || uNorm.indexOf(cNorm) >= 0));
    } else if (q.type === 'short') {
      uAnsStr = uAns || "";
      isRight = null; // essay for review
    }

    if (isRight === true) correct++;
    else if (isRight === false) {
      wrongItems.push({ q: q, uAns: uAnsStr });
      addToWrongBook(q, uAnsStr);
    }

    details.push({
      index: i + 1,
      q: q,
      userAns: uAnsStr,
      correctAns: q.answer,
      isRight: isRight
    });
  }

  var score = scorableTotal > 0 ? Math.round(correct / scorableTotal * 100) : 0;
  var timeStr = document.getElementById("examTimer").textContent.replace("⏱️ ", "");

  showExamResultModal(score, correct, scorableTotal, activeQuestions.length, timeStr, details, wrongItems);
}

function showExamResultModal(score, correct, scorable, total, timeStr, details, wrongItems) {
  var scoreClass = score >= 85 ? "score-pass" : (score >= 60 ? "score-warn" : "score-fail");
  var rating = score >= 90 ? "优秀 🌟" : (score >= 80 ? "良好 👍" : (score >= 60 ? "合格 🥉" : "需再接再厉 💪"));

  var html = '<div class="modal-score">';
  html += '  <h2 style="margin-bottom:8px">🎉 模拟考试成绩报告</h2>';
  html += '  <div class="big-num ' + scoreClass + '">' + score + '<span style="font-size:1.5rem">分</span></div>';
  html += '  <p style="color:var(--text-sub);margin-top:6px">考核评级：<b>' + rating + '</b> · 用时：' + timeStr + '</p>';
  html += '  <p style="font-size:0.9rem;margin-top:4px">客观题正确：<b>' + correct + '</b> / ' + scorable + ' 题（总考题 ' + total + ' 题）</p>';
  html += '</div>';

  html += '<div style="margin:16px 0;">';
  html += '  <h4 style="margin-bottom:8px">📋 答题详情核对</h4>';
  html += '  <div class="review-list">';
  for (var i = 0; i < details.length; i++) {
    var d = details[i];
    var tag = d.isRight === true ? '<span class="tag-res" style="color:var(--success)">✅ 正确</span>' : (d.isRight === false ? '<span class="tag-res" style="color:var(--danger)">❌ 错误</span>' : '<span class="tag-res" style="color:#d35400">💡 简答题自评</span>');
    html += '<div class="review-row">';
    html += '  <div><b>第 ' + d.index + ' 题.</b> ' + tag + ' ' + d.q.question + '</div>';
    html += '  <div style="font-size:0.85rem;color:var(--text-sub);margin-top:2px">';
    html += '    考生作答：<b>' + (d.userAns || '未作答') + '</b> | 参考答案：<b style="color:var(--primary)">' + d.correctAns + '</b>';
    html += '  </div>';
    html += '</div>';
  }
  html += '  </div>';
  html += '</div>';

  html += '<div style="display:flex;justify-content:center;gap:12px;margin-top:20px">';
  html += '  <button class="btn btn-secondary" onclick="closeResultModal()">关闭</button>';
  html += '  <button class="btn btn-primary" onclick="closeResultModal();startNewExam();">🔄 再测一套</button>';
  html += '</div>';

  document.getElementById("modalCard").innerHTML = html;
  document.getElementById("resultModal").classList.add("show");
}

function closeResultModal() {
  document.getElementById("resultModal").classList.remove("show");
}

// ==========================================
// 4. BROWSE / SEARCH MODE
// ==========================================
function initBrowse() {
  currentMode = 'browse';
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("questionNavWrap").style.display = "none";
  document.getElementById("bottomNavButtons").style.display = "none";
  renderBrowseList();
}

function onBrowseSearch() {
  renderBrowseList();
}

function renderBrowseList() {
  var keyword = (document.getElementById("browseSearchInput").value || "").trim().toLowerCase();
  var typeFilter = document.getElementById("browseTypeFilter").value;
  var hideAns = document.getElementById("hideAnswerToggle").checked;

  var list = ALL_QUESTIONS;
  if (typeFilter !== 'all') {
    list = list.filter(function(q) { return q.type === typeFilter; });
  }
  if (keyword) {
    list = list.filter(function(q) {
      return (q.question && q.question.toLowerCase().indexOf(keyword) >= 0) ||
             (q.answer && q.answer.toLowerCase().indexOf(keyword) >= 0) ||
             (q.options && q.options.some(function(o) { return o.toLowerCase().indexOf(keyword) >= 0; }));
    });
  }

  document.getElementById("browseCountText").textContent = "匹配 " + list.length + " 题";

  if (list.length === 0) {
    document.getElementById("questionArea").innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h3>未检索到匹配的题目</h3><p>请尝试其他关键词</p></div>';
    return;
  }

  var html = "";
  // Render in batch to keep UI responsive
  var renderCount = Math.min(list.length, 120);
  for (var i = 0; i < renderCount; i++) {
    var q = list[i];
    var badgeClass = "badge-single";
    var typeName = "单选";
    if (q.type === 'multi') { badgeClass = "badge-multi"; typeName = "多选"; }
    else if (q.type === 'fill') { badgeClass = "badge-fill"; typeName = "填空"; }
    else if (q.type === 'short') { badgeClass = "badge-short"; typeName = "简答"; }

    html += '<div class="browse-item">';
    html += '  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">';
    html += '    <div style="display:flex;align-items:center;gap:6px;">';
    html += '      <span class="q-type-badge ' + badgeClass + '">' + typeName + '</span>';
    html += '      <span style="font-size:0.85rem;font-weight:700;color:var(--text-sub)">#' + (i + 1) + '</span>';
    html += '    </div>';
    html += '    <button class="btn-star ' + (isFavorited(q.id) ? 'starred' : '') + '" onclick="toggleFavorite(\'' + q.id + '\')" title="收藏">★</button>';
    html += '  </div>';
    html += '  <div style="font-weight:600;line-height:1.6;color:#1e293b;margin-bottom:6px;">' + highlightKeyword(q.question, keyword) + '</div>';

    if (q.options && q.options.length > 0) {
      html += '  <div style="margin:8px 0;display:grid;grid-template-columns:1fr;gap:4px;font-size:0.9rem;color:#475569;">';
      for (var oi = 0; oi < q.options.length; oi++) {
        html += '<div>' + highlightKeyword(q.options[oi], keyword) + '</div>';
      }
      html += '  </div>';
    }

    var ansClass = hideAns ? "browse-hidden-ans" : "";
    html += '  <div class="browse-ans-box ' + ansClass + '" onclick="this.classList.toggle(\'revealed\')" title="点击查看/隐藏答案">';
    html += '    <b>💡 参考答案：</b><span style="color:var(--primary);font-weight:bold;">' + highlightKeyword(q.answer, keyword) + '</span>';
    if (hideAns) html += ' <span style="font-size:0.75rem;color:var(--text-sub);margin-left:6px">(点击查看)</span>';
    html += '  </div>';
    html += '</div>';
  }

  if (list.length > renderCount) {
    html += '<div style="text-align:center;padding:16px;color:var(--text-sub)">已展示前 ' + renderCount + ' 条，请输入关键词进行精准定位搜索</div>';
  }

  document.getElementById("questionArea").innerHTML = html;
}

function highlightKeyword(text, kw) {
  if (!kw || !text) return text;
  var reg = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return text.replace(reg, function(m) { return '<span style="background:#fef08a;color:#854d0e;padding:0 2px;border-radius:2px">' + m + '</span>'; });
}

// ==========================================
// 5. WRONG BOOK & FAVORITES MODE
// ==========================================
function initWrongMode() {
  currentMode = 'wrong';
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("questionNavWrap").style.display = "none";
  document.getElementById("bottomNavButtons").style.display = "none";
  renderWrongModeList();
}

function renderWrongModeList() {
  var wb = getWrongBook();
  document.getElementById("wrongStatText").textContent = wb.length + " 道错题";

  if (wb.length === 0) {
    document.getElementById("questionArea").innerHTML = '<div class="empty-state"><div class="empty-icon">🎉</div><h3>错题本空空如也！</h3><p>刷题或考试时做错的题目会自动收录到这里</p></div>';
    return;
  }

  var html = "";
  for (var i = 0; i < wb.length; i++) {
    var item = wb[i];
    html += '<div class="browse-item" style="border-left:4px solid var(--danger);">';
    html += '  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
    html += '    <span style="font-size:0.8rem;color:var(--danger);font-weight:bold;">错题 #' + (i + 1) + ' · 累计做错 ' + (item.wrongCount || 1) + ' 次</span>';
    html += '    <button class="btn btn-secondary" style="padding:2px 8px;font-size:0.75rem;" onclick="removeFromWrongBook(\'' + item.id + '\')">从错题本移出</button>';
    html += '  </div>';
    html += '  <div style="font-weight:600;margin-bottom:8px;">' + item.question + '</div>';
    if (item.options && item.options.length > 0) {
      html += '  <div style="font-size:0.9rem;color:#475569;margin-bottom:8px;">' + item.options.join(" &nbsp;|&nbsp; ") + '</div>';
    }
    html += '  <div style="background:var(--danger-bg);padding:8px 12px;border-radius:8px;font-size:0.9rem;">';
    html += '    <b>✅ 正确答案：</b><span style="color:var(--success);font-weight:bold;">' + item.answer + '</span>';
    if (item.lastUserAns) html += ' <span style="color:var(--text-sub);margin-left:10px;">(上次作答: ' + item.lastUserAns + ')</span>';
    html += '  </div>';
    html += '</div>';
  }
  document.getElementById("questionArea").innerHTML = html;
}

function practiceWrongQuestions() {
  var wb = getWrongBook();
  if (wb.length === 0) { showToast("错题本是空的！"); return; }
  activeQuestions = wb.map(function(item) {
    return {
      id: item.id,
      question: item.question,
      options: item.options || [],
      answer: item.answer,
      type: item.type,
      category: item.category
    };
  });
  switchMode('study');
  document.getElementById("studyTypeFilter").value = "all";
  currentIdx = 0;
  userAnswers = {};
  checkedStatus = {};
  correctCount = 0;
  totalAttempted = 0;
  updateStudyStats();
  renderCurrentQuestion();
  renderNavGrid();
  showToast("开始专练错题！共 " + activeQuestions.length + " 道");
}

function clearAllWrong() {
  if (!confirm("确定清空全部错题记录吗？")) return;
  saveWrongBook([]);
  renderWrongModeList();
  showToast("错题本已清空");
}

function initFavMode() {
  currentMode = 'fav';
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("questionNavWrap").style.display = "none";
  document.getElementById("bottomNavButtons").style.display = "none";
  renderFavModeList();
}

function renderFavModeList() {
  var favIds = getFavorites();
  document.getElementById("favStatText").textContent = favIds.length + " 道收藏";

  var favQuestions = ALL_QUESTIONS.filter(function(q) { return favIds.indexOf(q.id) >= 0; });
  if (favQuestions.length === 0) {
    document.getElementById("questionArea").innerHTML = '<div class="empty-state"><div class="empty-icon">⭐</div><h3>收藏夹还是空的</h3><p>刷题或浏览时点击题目右上角的五角星即可收藏</p></div>';
    return;
  }

  var html = "";
  for (var i = 0; i < favQuestions.length; i++) {
    var q = favQuestions[i];
    html += '<div class="browse-item" style="border-left:4px solid #f39c12;">';
    html += '  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
    html += '    <span style="font-size:0.8rem;color:#b7791f;font-weight:bold;">收藏 #' + (i + 1) + ' · ' + q.category + '</span>';
    html += '    <button class="btn btn-secondary" style="padding:2px 8px;font-size:0.75rem;" onclick="toggleFavorite(\'' + q.id + '\')">取消收藏</button>';
    html += '  </div>';
    html += '  <div style="font-weight:600;margin-bottom:8px;">' + q.question + '</div>';
    if (q.options && q.options.length > 0) {
      html += '  <div style="font-size:0.9rem;color:#475569;margin-bottom:8px;">' + q.options.join(" &nbsp;|&nbsp; ") + '</div>';
    }
    html += '  <div class="browse-ans-box"><b>💡 正确答案：</b><span style="color:var(--primary);font-weight:bold;">' + q.answer + '</span></div>';
    html += '</div>';
  }
  document.getElementById("questionArea").innerHTML = html;
}

function practiceFavQuestions() {
  var favIds = getFavorites();
  var favQuestions = ALL_QUESTIONS.filter(function(q) { return favIds.indexOf(q.id) >= 0; });
  if (favQuestions.length === 0) { showToast("收藏夹是空的！"); return; }
  activeQuestions = favQuestions.slice();
  switchMode('study');
  document.getElementById("studyTypeFilter").value = "all";
  currentIdx = 0;
  userAnswers = {};
  checkedStatus = {};
  correctCount = 0;
  totalAttempted = 0;
  updateStudyStats();
  renderCurrentQuestion();
  renderNavGrid();
  showToast("开始专练收藏题目！共 " + activeQuestions.length + " 道");
}

function clearAllFav() {
  if (!confirm("确定清空全部收藏记录吗？")) return;
  saveFavorites([]);
  renderFavModeList();
  showToast("收藏夹已清空");
}

// ==========================================
// 6. GLOBAL MODE SWITCHER & KEYBOARD
// ==========================================
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
  document.getElementById("studyControls").style.display = "none";
  document.getElementById("examControls").style.display = "none";
  document.getElementById("browseControls").style.display = "none";
  document.getElementById("wrongControls").style.display = "none";
  document.getElementById("favControls").style.display = "none";
  document.getElementById("resumeBanner").classList.remove("show");

  if (mode === 'study') {
    document.getElementById("tabStudy").classList.add("active");
    document.getElementById("studyControls").style.display = "flex";
    initStudy(document.getElementById("studyTypeFilter").value, false, null);
    checkResumeStudy();
  } else if (mode === 'exam') {
    document.getElementById("tabExam").classList.add("active");
    document.getElementById("examControls").style.display = "flex";
    document.getElementById("progressWrap").style.display = "none";
    document.getElementById("questionNavWrap").style.display = "none";
    document.getElementById("bottomNavButtons").style.display = "none";
    document.getElementById("questionArea").innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><h3>马克思主义基本原理模拟测试</h3><p>支持全真期末试卷（100题: 单选70+多选30）或随机专项测试</p><p style="margin-top:16px"><button class="btn btn-primary" style="padding:10px 24px" onclick="startNewExam()">立即开始考试</button></p></div>';
  } else if (mode === 'browse') {
    document.getElementById("tabBrowse").classList.add("active");
    document.getElementById("browseControls").style.display = "flex";
    initBrowse();
  } else if (mode === 'wrong') {
    document.getElementById("tabWrong").classList.add("active");
    document.getElementById("wrongControls").style.display = "flex";
    initWrongMode();
  } else if (mode === 'fav') {
    document.getElementById("tabFav").classList.add("active");
    document.getElementById("favControls").style.display = "flex";
    initFavMode();
  }
}

// Keyboard shortcuts for study & exam
document.addEventListener("keydown", function(e) {
  // If typing in input, don't trigger shortcuts
  var tag = (e.target.tagName || "").toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;

  if (e.key === "ArrowRight") {
    e.preventDefault();
    nextQuestion();
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    prevQuestion();
  } else if (e.key === "a" || e.key === "A") {
    if (currentMode === 'study') onSelectOption('A');
    else if (currentMode === 'exam') onExamSelectOption('A');
  } else if (e.key === "b" || e.key === "B") {
    if (currentMode === 'study') onSelectOption('B');
    else if (currentMode === 'exam') onExamSelectOption('B');
  } else if (e.key === "c" || e.key === "C") {
    if (currentMode === 'study') onSelectOption('C');
    else if (currentMode === 'exam') onExamSelectOption('C');
  } else if (e.key === "d" || e.key === "D") {
    if (currentMode === 'study') onSelectOption('D');
    else if (currentMode === 'exam') onExamSelectOption('D');
  } else if (e.key === "Enter") {
    if (currentMode === 'study') submitAnswer();
  } else if (e.key === "Escape") {
    closeResultModal();
  }
});

// App Entry
function init() {
  updateBadges();
  switchMode('study');
}

window.addEventListener("DOMContentLoaded", init);
</script>
